<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nguyễn Anh Tú | Voice Talent</title>
<meta name="description" content="Nguyễn Anh Tú - Voice Talent giọng nam. Nghe demo TVC, phim doanh nghiệp, game, podcast.">
<meta property="og:title" content="Nguyễn Anh Tú | Voice Talent"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Playfair+Display:wght@700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="i-hp" viewBox="0 0 24 24"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-5h3zM3 15a2 2 0 0 0 2 2h1v-5H3z"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.2A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-fb" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></symbol>
<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-job" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></symbol>
<symbol id="i-tool" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="i-find" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></symbol>
</defs></svg>
<nav><div class="wrap"><b><svg class="i"><use href="#i-mic"/></svg><span id="nb">Nguyễn Anh Tú</span></b>
<a href="#samples"><svg class="i"><use href="#i-hp"/></svg><span>Sample</span></a>
<a href="#about"><svg class="i"><use href="#i-user"/></svg><span>Giới thiệu</span></a>
<a href="#contact"><svg class="i"><use href="#i-phone"/></svg><span>Liên hệ</span></a></div></nav>
<header class="hero"><div class="wave" id="wave"></div><div class="wrap">
<div class="hgrid">
<div class="htext">
<h1 id="name">Nguyễn Anh Tú</h1>
<div class="role"><svg class="i"><use href="#i-mic"/></svg><span id="role"></span></div>
<p id="tag"></p>
<div class="acts">
<a class="btn fill" href="#samples"><svg class="i f"><use href="#i-play"/></svg>Nghe demo</a>
<a class="btn" href="#contact"><svg class="i"><use href="#i-send"/></svg>Liên hệ ngay</a></div></div>
<div class="pic" id="pic"><div class="frame"><img id="photo" alt="Nguyễn Anh Tú" hidden><div class="ph" id="ph"><svg class="i"><use href="#i-user"/></svg></div></div></div>
</div></div></header>
<div class="brandsec" id="brandsSec" hidden><div class="wrap"><h2><svg class="i"><use href="#i-job"/></svg>Đơn vị đã hợp tác</h2></div>
<div class="marq" id="brands"><div></div></div></div>
<section id="samples"><div class="wrap"><h2><svg class="i"><use href="#i-hp"/></svg>Voice samples</h2>
<div class="tools" id="chips"><label class="sb"><svg class="i"><use href="#i-find"/></svg><input id="q" placeholder="Tìm sample..." aria-label="Tìm sample"></label></div>
<div class="grid" id="grid"></div></div></section>
<section id="about"><div class="wrap"><h2><svg class="i"><use href="#i-user"/></svg>Giới thiệu</h2><p class="about" id="about-t"></p>
<div class="two"><div class="box"><h3><svg class="i"><use href="#i-job"/></svg>Kinh nghiệm</h3><ul id="exp"></ul></div>
<div class="box"><h3><svg class="i"><use href="#i-tool"/></svg>Kỹ năng - Thiết bị</h3><ul id="skills"></ul></div></div></div></section>
<section id="contact"><div class="wrap"><h2><svg class="i"><use href="#i-phone"/></svg>Liên hệ</h2><div class="contact" id="ct"></div></div></section>
<footer>© <span id="yr"></span> <span id="fn">Nguyễn Anh Tú</span> - Voice Talent</footer>
<script type="module">
import {db,yt,esc,DEFAULTS,SHAPE_RADIUS,SHAPE_RATIO} from "./firebase.js";
import {collection,getDocs,query,where,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const $=s=>document.querySelector(s), ord=(a,b)=>(a.order||0)-(b.order||0);
const load=async c=>(await getDocs(query(collection(db,c),where("visible","==",true)))).docs.map(d=>({id:d.id,...d.data()})).sort(ord);
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
$("#yr").textContent=new Date().getFullYear();
$("#wave").innerHTML=Array.from({length:70},(_,i)=>`<i style="--h:${20+Math.abs(Math.sin(i*.5)*70)+Math.random()*10}%;--d:${(i%12)*.2}s"></i>`).join("");
const lines=t=>(t||"").split("\n").filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("");
let p={...DEFAULTS};
try{const r=(await getDoc(doc(db,"site","profile"))).data()||{};for(const k in r)if(r[k])p[k]=r[k]}catch(e){console.warn(e)}
document.title=p.name+" | Voice Talent";
for(const id of ["name","nb","fn"])$("#"+id).textContent=p.name;
$("#role").textContent=p.role;$("#tag").textContent=p.tagline;$("#about-t").textContent=p.about;$("#exp").innerHTML=lines(p.exp);$("#skills").innerHTML=lines(p.skills);
if(p.photo){$("#photo").src=p.photo;$("#photo").hidden=false;$("#ph").hidden=true}
$("#pic").style.borderRadius=SHAPE_RADIUS[p.photoShape]||"50%";
$("#pic").style.aspectRatio=SHAPE_RATIO[p.photoShape]||"1/1";
$("#photo").style.objectPosition=`${p.photoX??50}% ${p.photoY??50}%`;
$("#photo").style.transform=`scale(${(p.photoZoom||100)/100})`;
const tel=String(p.phone).replace(/\s|\./g,"");
const L=[["phone","tel:"+tel,"Gọi điện",p.phone],["chat","https://zalo.me/"+String(p.zalo).replace(/\D/g,""),"Zalo",p.zalo],["mail","mailto:"+p.email,"Email",p.email],["fb",p.facebook,"Facebook","Nhắn tin qua Facebook"]];
$("#ct").innerHTML=L.filter(x=>x[3]).map(x=>`<a class="ct" href="${esc(x[1])}" ${x[0]=="fb"?'target="_blank" rel="noopener"':""} aria-label="${esc(x[2])}: ${esc(x[3])}">${ic(x[0])}<span>${x[2]}</span></a>`).join("");
let B=[];try{B=await load("brands")}catch(e){console.warn(e)}
if(B.length){
 const h=B.map(x=>x.logo?
  `<div class="bitem"><div class="ring"><div class="blogo"><img src="${esc(x.logo)}" alt="${esc(x.name)}" loading="lazy"></div></div></div>`:
  `<div class="bitem noimg"><span class="bname">${esc(x.name)}</span></div>`).join("");
 $("#brandsSec").hidden=false;
 const track=document.querySelector("#brands div");
 const shapeLogos=root=>root.querySelectorAll(".blogo img").forEach(img=>{
  const apply=()=>{const r=img.naturalWidth/(img.naturalHeight||1),oval=r>1.3;img.closest(".blogo").classList.toggle("oval",oval);img.closest(".ring").classList.toggle("oval",oval)};
  img.complete?apply():img.addEventListener("load",apply,{once:true})});
 track.innerHTML=h;
 requestAnimationFrame(()=>{
  const setW=track.scrollWidth||1,target=Math.max(window.innerWidth*2.2,1200);
  let reps=2;while(reps*setW<target)reps+=2;
  track.innerHTML=h.repeat(reps);
  shapeLogos(track);
 });
}
let S=[],cat="",kw="";
try{S=await load("samples")}catch(e){console.warn(e)}
if(!S.length)S=[["Trầm ấm - truyền cảm","Sample mẫu 1"],["Mạnh mẽ - hùng tráng","Sample mẫu 2"],["Game","Sample mẫu 3"]].map(([category,title])=>({category,title,brand:"Thay bằng nội dung thật trong Admin",url:"#"}));
const cats=[...new Set(S.map(s=>s.category).filter(Boolean))];
$("#chips").insertAdjacentHTML("afterbegin",["Tất cả",...cats].map((c,i)=>`<button class="chip${i?"":" on"}" data-c="${i?esc(c):""}">${esc(c)}</button>`).join(""));
function card(s){
 const id=yt(s.url),cv=s.cover||(id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:"");
 let m;
 if(id)m=`<div class="media" data-yt="${id}" role="button" tabindex="0" aria-label="Phát ${esc(s.title)}" style="background-image:url('${esc(cv)}')"><span class="play"><svg class="i f"><use href="#i-play"/></svg></span></div>`;
 else if(/\.(mp3|wav|m4a|ogg)(\?|$)/i.test(s.url))m=`<div class="audio">${ic("hp")}<audio controls preload="none" src="${esc(s.url)}"></audio></div>`;
 else if(/\.(mp4|webm)(\?|$)/i.test(s.url))m=`<video controls preload="none" poster="${esc(cv)}" src="${esc(s.url)}"></video>`;
 else m=`<a class="media" href="${esc(s.url)}" target="_blank" rel="noopener" style="background-image:url('${esc(cv)}')"><span class="play"><svg class="i f"><use href="#i-play"/></svg></span></a>`;
 return `<article class="card">${m}<h3>${esc(s.title)}</h3><small>${esc([s.brand,s.category].filter(Boolean).join(" • "))}</small></article>`}
function draw(){
 const r=S.filter(s=>(!cat||s.category===cat)&&(s.title+" "+(s.brand||"")).toLowerCase().includes(kw));
 $("#grid").innerHTML=r.map(card).join("")||"<p>Không có sample phù hợp.</p>"}
draw();
$("#chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));cat=c.dataset.c;draw()};
$("#q").oninput=e=>{kw=e.target.value.toLowerCase();draw()};
const go=e=>{const m=e.target.closest("[data-yt]");if(m&&(e.type=="click"||e.key=="Enter"))m.outerHTML=`<div class="media"><iframe src="https://www.youtube.com/embed/${m.dataset.yt}?autoplay=1" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>`};
$("#grid").onclick=go;$("#grid").onkeydown=go;
document.addEventListener("play",e=>document.querySelectorAll("audio,video").forEach(m=>m!==e.target&&m.pause()),true);
</script></body></html>
